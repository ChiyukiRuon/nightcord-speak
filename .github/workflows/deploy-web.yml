name: Web Deploy

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: '预设 WSS 网关地址；留空使用 NIGHTCORD_GATEWAY_URL Secret 或变量'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web.yml'
      - '.gitmodules'
      - 'apps/client/**'
      - 'vendor/flutter-webrtc/**'
      - 'scripts/build-web.py'
      - 'scripts/fetch-fonts.sh'

permissions:
  contents: read

concurrency:
  group: web-deploy-production
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build:
    name: Build static web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check server configuration
        if: github.ref == 'refs/heads/main'
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          for name in SERVER_IP SERVER_USER SERVER_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Secret: $name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch UI fonts
        run: bash scripts/fetch-fonts.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-deploy-ffi
      - name: Prepare native FFI for client checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config cmake
          cargo build --locked -p ts-ffi
      - name: Resolve Flutter dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Analyze client
        working-directory: apps/client
        run: flutter analyze
      - name: Build web
        env:
          NIGHTCORD_GATEWAY_URL: ${{ inputs.gateway_url || secrets.NIGHTCORD_GATEWAY_URL || vars.NIGHTCORD_GATEWAY_URL }}
          NIGHTCORD_GATEWAY_TOKEN: ${{ secrets.NIGHTCORD_GATEWAY_TOKEN }}
        run: |
          if [[ -n "$NIGHTCORD_GATEWAY_URL" && "$NIGHTCORD_GATEWAY_URL" != wss://* ]]; then
            echo 'HTTPS hosting requires a wss:// gateway URL.' >&2
            exit 1
          fi
          python scripts/build-web.py
          test -s apps/client/build/web/index.html
          test -s apps/client/build/web/flutter_bootstrap.js
          cd apps/client/build/web
          sha256sum index.html flutter_bootstrap.js main.dart.js > deploy-checksums.txt
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: nightcord-web-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/client/build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Upload website to server
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: nightcord-web-${{ github.run_number }}-${{ github.run_attempt }}
          path: web
      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -eu
            command -v rsync >/dev/null
            command -v sha256sum >/dev/null
            command -v realpath >/dev/null
            mkdir -p /var/www/nightcord.chiyukiruon.top
            mkdir -p /var/www/.nightcord.chiyukiruon.top-upload-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload website
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: web
          target: /var/www/.nightcord.chiyukiruon.top-upload-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
      - name: Verify and publish website
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -eu
            staging=/var/www/.nightcord.chiyukiruon.top-upload-${{ github.run_id }}-${{ github.run_attempt }}
            target=/var/www/nightcord.chiyukiruon.top
            test "$(realpath "$staging")" = "$staging"
            test "$(realpath "$target")" = "$target"
            cd "$staging"
            test -s index.html
            test -s flutter_bootstrap.js
            sha256sum -c deploy-checksums.txt
            # 上传校验通过后才同步正式目录，并清理过期资源。
            rsync -a --delete --delay-updates --chmod=D755,F644 "$staging/" "$target/"
            cd "$target"
            sha256sum -c deploy-checksums.txt
            printf '%s\n' '${{ github.sha }}' > deployed-commit.txt
            # 仅删除本次运行创建且路径已校验的临时上传目录。
            rm -rf -- "$staging"
            echo '网页已部署到 /var/www/nightcord.chiyukiruon.top/'
