name: Gateway Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/gateway-image.yml'
      - '.dockerignore'
      - '.env.example'
      - '.gitmodules'
      - 'LICENSE-*'
      - 'docker-compose*.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/gateway/**'
      - 'apps/cli/**'
      - 'apps/client/pubspec.yaml'
      - 'apps/client/assets/licenses/third_party.json'
      - 'crates/**'
      - 'vendor/tsclientlib/**'
      - 'vendor/webrtc-apm/**'
      - 'scripts/audio-build-requirements.txt'
      - 'scripts/gateway-docker-smoke.py'
  pull_request:
    paths:
      - '.github/workflows/gateway-image.yml'
      - '.dockerignore'
      - '.env.example'
      - '.gitmodules'
      - 'LICENSE-*'
      - 'docker-compose*.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'apps/gateway/**'
      - 'apps/cli/**'
      - 'apps/client/pubspec.yaml'
      - 'apps/client/assets/licenses/third_party.json'
      - 'crates/**'
      - 'vendor/tsclientlib/**'
      - 'vendor/webrtc-apm/**'
      - 'scripts/audio-build-requirements.txt'
      - 'scripts/gateway-docker-smoke.py'

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve image and pinned toolchain
        id: config
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              if not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?', os.environ['GITHUB_REF_NAME']):
                  raise SystemExit('Use vX.Y.Z or vX.Y.Z-alpha/beta/rc.N (N >= 1).')
          version = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower() + '-gateway'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image={image}\nrust-version={version}\n')
          PY
      - name: Generate OCI image labels
        id: labels
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.config.outputs.image }}
          labels: |
            org.opencontainers.image.title=Nightcord Speak Gateway
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: RUST_VERSION=${{ steps.config.outputs.rust-version }}
          load: true
          tags: nightcord-gateway:smoke
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gateway-${{ matrix.arch }}
      - name: Verify Compose runtime, authentication and persistent data
        run: python scripts/gateway-docker-smoke.py --image nightcord-gateway:smoke
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publish only tested architecture images; user-facing tags are added
      # after both native builds succeed, so one failure cannot advance main.
      - name: Push tested image by digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: RUST_VERSION=${{ steps.config.outputs.rust-version }}
          outputs: type=image,name=${{ steps.config.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
      - name: Export digest
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.push.outcome == 'success'
        with:
          name: gateway-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-gateway" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags and OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Merge tested architectures
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$METADATA")
          sources=()
          for digest in "${digests[@]}"; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$METADATA")"
