name: nightcord_client
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Ships the Material/Cupertino/Widgets translation delegates that go
  # alongside our own `AppLocalizations`.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  ffi: ^2.2.0
  # Browser APIs; already transitive, now used by the remote capability adapters.
  web: ^1.1.1
  local_notifier: ^0.1.6
  hotkey_manager: ^0.2.3
  # `any` on purpose: the generated localization code imports this, and its
  # version is pinned by `flutter_localizations`, not by us. Naming a range
  # here would only be a second opinion that can conflict with the SDK's.
  intl: any
  # Screen sharing, TS6 only. The media side — capture, encode, transport,
  # render — is the one thing this project does not write itself: doing it in
  # Rust means integrating three more stacks per platform, and the browser
  # still needs its own. Only `ScreenShareBackend` implements it, so replacing
  # it later touches one file. See `docs/screen-sharing.md`.
  flutter_webrtc: ^1.6.2+hotfix.4
  # A second operating-system window, for watching a share outside the client.
  # Its own engine, so the picture is joined again rather than copied — see
  # `docs/screen-sharing.md`. Windows only so far.
  desktop_multi_window: ^0.3.1
  # Sizes, titles and closes that window. `desktop_multi_window` deliberately
  # has none of those and defers to this, which is why both arrived together.
  window_manager: ^0.5.2
  file_selector: ^1.1.0

# The screen-share media stack builds from our fork — a submodule on the
# `nightcord` branch, whose history is the published 1.6.2+hotfix.4 package
# plus small patches (currently the macOS custom-audio-device hook). The
# version above is what the patch base corresponds to. See
# `docs/screen-sharing.md` and `docs/tsclientlib-fork.md` for the same
# approach applied to the TeamSpeak library.
dependency_overrides:
  flutter_webrtc:
    path: ../../vendor/flutter-webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs `gen-l10n` during `pub get`/`run`/`build` so the generated
  # `lib/l10n/app_localizations*.dart` files stay in step with the ARB files.
  # The generated files are committed (see `l10n.yaml`): `flutter analyze` and
  # `flutter test` do *not* regenerate, so a clone without them would not even
  # analyze.
  generate: true

  # --- UI fonts (docs/UI字体规范.md) -----------------------------------------
  #
  # **These files are not in the repository.** They are ~50 MB of binary that
  # never changes, so `scripts/fetch-fonts.sh` downloads them and
  # `assets/fonts/` is gitignored. A build without them fails on a missing
  # asset — deliberately, because the alternative is every screen quietly
  # rendering in whatever the platform calls its default font, which is the
  # inconsistency `docs/UI字体规范.md` exists to remove. Run the script once
  # after cloning; `AGENTS.md` §3.2 lists it with the other prerequisites.
  #
  # Both are **variable** fonts: one file carries every weight, so neither
  # declares `weight:` here. A weight is selected with
  # `TextStyle.fontVariations` — see `AppTypography`, which sets it (and
  # `fontWeight` beside it) for every style in the scale.
  #
  # One family per language the app ships (`en`, `zh`, `zh_Hant`, `ja`, `ko` —
  # see `l10n.yaml`), and no more: §9 of the specification is explicit that a
  # language the app does not ship should not be paid for in bundle size. Text
  # in other languages still renders through Flutter's per-glyph system
  # fallback, the same mechanism §8 relies on for emoji.
  #
  # Four CJK faces rather than one, because they are not interchangeable: the
  # same ideograph is drawn with different shapes in Simplified Chinese,
  # Traditional Chinese, Japanese and Korean. `AppFonts.forLocale` picks one;
  # adding a locale means a family here *and* a case there, together.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf

    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf

    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Variable.ttf

    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf

    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf

  # The fonts' own licence. OFL §1 requires it to travel with the font, and it
  # is fetched alongside them because it is not in the repository either. An
  # asset rather than a font family: it is a text file, and declaring it as a
  # face would have Flutter try to parse it as one.
  assets:
    - assets/sounds/nightcord/
    - assets/licenses/third_party.json
    - assets/fonts/OFL.txt

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
