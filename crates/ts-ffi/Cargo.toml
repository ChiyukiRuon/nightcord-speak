[package]
name = "ts-ffi"
description = "C ABI boundary: JSON in, JSON out, opaque handles. Nothing above this knows Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `cdylib` is the artifact Flutter loads. `rlib` as well, because a cdylib alone
# has no test harness — `cargo test` cannot link one.
name = "nightcord_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
ts-audio.workspace = true
ts-core.workspace = true
ts-crash.workspace = true
ts-events.workspace = true
ts-identity.workspace = true
ts-logging.workspace = true
ts-model.workspace = true
ts-protocol.workspace = true
ts-session.workspace = true
ts-settings.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Only for tests: they install a subscriber that captures records into a
# buffer, which is how the "the UI saw it, so the log has it" rule is checked.
tracing-subscriber.workspace = true
