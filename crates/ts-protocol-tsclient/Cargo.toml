[package]
name = "ts-protocol-tsclient"
description = "Shared tsclientlib adapter: the base protocol TeamSpeak 3 and 6 have in common."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Re-exports tsclientlib so the adapter can be debugged from a scratch binary.
# Off by default: nothing outside this crate may depend on tsclientlib (§77).
unstable = []

[dependencies]
ts-events.workspace = true
ts-identity.workspace = true
ts-model.workspace = true
ts-protocol.workspace = true

async-trait.workspace = true
base64.workspace = true
futures = "0.3"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

tsclientlib.workspace = true
# Packet types for the voice path: `OutAudio` to send, `InAudioBuf` to receive.
# `tsclientlib`'s `audio` feature is what makes these exist at all.
tsproto-packets = { path = "../../vendor/tsclientlib/utils/tsproto-packets" }
