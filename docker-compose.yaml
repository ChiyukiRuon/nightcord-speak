name: nightcord-speak-gateway

services:
  gateway:
    image: ${NIGHTCORD_GATEWAY_IMAGE:-ghcr.io/chiyukiruon/nightcord-speak-gateway:main}
    restart: always
    init: true
    ports:
      - "${NIGHTCORD_GATEWAY_HOST:-127.0.0.1}:${NIGHTCORD_GATEWAY_PORT:-8787}:8787"
    environment:
      NIGHTCORD_GATEWAY_TOKEN: ${NIGHTCORD_GATEWAY_TOKEN:-}
      NIGHTCORD_GATEWAY_ORIGINS: ${NIGHTCORD_GATEWAY_ORIGINS:-}
      NIGHTCORD_GATEWAY_PROFILE: ${NIGHTCORD_GATEWAY_PROFILE:-web}
      RUST_LOG: ${NIGHTCORD_GATEWAY_LOG:-info}
      TZ: ${NIGHTCORD_GATEWAY_TZ:-Asia/Shanghai}
    volumes:
      - gateway-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  gateway-data:
